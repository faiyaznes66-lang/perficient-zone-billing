<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Sign in | Perficient Zone Billing</title><link rel="stylesheet" href="/theme.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#f4f8f7,#e8f3f1)}
.login-card{width:min(430px,calc(100% - 32px));background:white;border:1px solid var(--border);border-radius:24px;padding:34px;box-shadow:var(--shadow)}
.login-brand{justify-content:center;margin-bottom:28px}.login-card h1{text-align:center;margin:0;color:var(--navy);font-size:28px}.sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin:10px 0 24px}
.field{width:100%;height:50px;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:white;color:var(--ink);outline:none}.field:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,117,104,.11)}
.full{width:100%;height:50px;margin-top:11px}.alt{width:100%;border:0;background:transparent;color:var(--muted);padding:12px;cursor:pointer}.msg{font-size:13px;color:var(--muted);min-height:18px;text-align:center;margin-top:14px}.msg.err{color:var(--danger)}[hidden]{display:none!important}.fine{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}
</style>
</head>
<body>
<main class="login-card">
  <a class="brand login-brand" href="/"><span class="brand-mark">P</span><span>Perficient Zone Billing</span></a>
  <h1 id="title">Sign in or create an account</h1>
  <p class="sub" id="sub">Enter your email and we'll send you a secure sign-in link. No password to remember.</p>
  <form id="form" novalidate>
    <div id="email-row"><input class="field" id="email" type="email" placeholder="you@company.com" autocomplete="username webauthn" required></div>
    <div id="code-row" hidden></div>
    <button class="btn btn-primary full" id="submit" type="submit">Send sign-in link</button>
    <button class="alt" id="back" type="button" hidden>Use a different email</button>
  </form>
  <div id="passkey" hidden>
    <button class="btn btn-primary full" id="passkey-add" type="button">Add a passkey</button>
    <button class="alt" id="passkey-skip" type="button">Not now</button>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <p class="fine">By continuing, you agree to use the service only for lawful business invoicing.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/runtime-config.js"></script>
<script>
(function(){
  var cfg=window.__APP_CONFIG__||{};
  var A=window.supabase&&window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  var form=document.getElementById('form'),emailEl=document.getElementById('email'),submit=document.getElementById('submit');
  var msg=document.getElementById('msg'),sub=document.getElementById('sub');
  function safeNext(){var raw=new URLSearchParams(location.search).get('next')||'/app/';return(raw[0]==='/'&&raw.indexOf('//')!==0)?raw:'/app/'}
  function say(t,k){msg.textContent=t||'';msg.className='msg '+(k||'')}
  if(!A){say('Sign-in is unavailable. Refresh and try again.','err');submit.disabled=true;return}
  A.auth.getSession().then(function(r){if(r.data&&r.data.session)location.replace(safeNext())});
  form.onsubmit=async function(e){
    e.preventDefault();submit.disabled=true;
    try{
      var email=(emailEl.value||'').trim();if(!email)throw new Error('Enter your email address.');
      var r=await A.auth.signInWithOtp({email:email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+'/app/'}});
      if(r.error)throw r.error;
      emailEl.disabled=true;submit.hidden=true;
      sub.textContent='We sent a secure sign-in link to '+email+'. Open the email and click the link to continue.';
      say('Sign-in link sent. You can keep this page open.'); 
    }catch(err){say((err&&err.message)||'Could not send the sign-in link.','err');submit.disabled=false}
  };
  emailEl.focus();
})();
</script>
</body></html>
