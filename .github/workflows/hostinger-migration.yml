name: Hostinger migration checks

on:
  push:
    branches: [hostinger-migration]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          find api pages lib compat -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Confirm migration runtime files
        run: |
          test -f .env.example
          test -f migrations/028_enable_rls.sql
          test -f migrations/029_storage_buckets.sql
          test -f public/help/index.html
